name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencias (torch CPU)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[zspace,hf,dev]" "numpy>=2"
      - name: Lint
        run: python -m ruff check --select E,F,W,B --ignore E501 fuga tests scripts
      - name: Sintaxis del arranque de RunPod
        run: bash -n scripts/runpod/arranque.sh
      - name: Tests (incluye la cadena final en miniatura)
        run: python -m pytest -q
